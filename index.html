<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalculatorX - Material 3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2 class="title">Calculate me</h2>

  <div class="calculator">
    <div class="display-container">
      <input type="text" id="inputbox" placeholder="0" readonly>
    </div>

    <div class="grid">
      <button id="ac">AC</button>
      <button class="action-btn">DEL</button>
      <button class="op-sym">%</button>
      <button class="op-sym">/</button>

      <button class="num">7</button>
      <button class="num">8</button>
      <button class="num">9</button>
      <button class="op-sym">*</button>

      <button class="num">4</button>
      <button class="num">5</button>
      <button class="num">6</button>
      <button class="op-sym">-</button>

      <button class="num">1</button>
      <button class="num">2</button>
      <button class="num">3</button>
      <button class="op-sym">+</button>

      <button class="num">00</button>
      <button class="num">0</button>
      <button class="num">.</button>
      <button id="eq">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
